name: Altin Fiyatlarini Guncelle

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: update-gold
  cancel-in-progress: true

jobs:

  update-gold:

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - name: Repoyu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Playwright kur
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Altin fiyatlarini tara
        run: |
          node scripts/update-gold.js

      - name: Altin verisini GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # npm install nedeniyle oluşabilecek gereksiz değişiklikleri temizle
          git restore package.json package-lock.json 2>/dev/null || true

          git add data/gold-latest.json

          if git diff --cached --quiet; then
            echo "Altin fiyatlarinda degisiklik yok."
            exit 0
          fi

          git commit -m "data: altin fiyatlarini guncelle"

          git push origin HEAD:main
