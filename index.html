<style>

<script>


/*
 * -------------------------------------------------------
 * MODEL / KAMPANYA LINKLERİ
 * -------------------------------------------------------
 */

let MODEL_LINKS = {};


function normalizeLinkKey(value){

  return String(value || "")
    .toLocaleLowerCase("tr-TR")
    .replace(/\s+/g," ")
    .trim();

}


function getModelLink(d){

  const key =
    `${normalizeLinkKey(d.brand)}|` +
    `${normalizeLinkKey(d.model)}`;

  return MODEL_LINKS[key] || null;

}


/*
 * -------------------------------------------------------
 * ŞEFFAF MARKA LOGOLARI
 * -------------------------------------------------------
 *
 * Simple Icons CDN kullanılıyor.
 *
 * Beyaz kutu / favicon YOK.
 * SVG şeffaf olarak gösteriliyor.
 * Claude API maliyeti YOK.
 */

const BRAND_LOGOS = {

    "https://cdn.simpleicons.org/bmw/FFFFFF",

    "https://cdn.simpleicons.org/audi/FFFFFF",

    "https://cdn.simpleicons.org/volvo/FFFFFF",

  "Lexus":

  "Togg":
    "https://cdn.simpleicons.org/togg/FFFFFF",

  "DS Automobiles":
    "https://cdn.simpleicons.org/dsautomobiles/FFFFFF"

};


function getBrandLogo(brand){

  return (
    BRAND_LOGOS[brand] ||
    null
  );

}


function initials(brand){

  return String(
    brand || ""
  )
    .split(/\s+/)
    .filter(Boolean)
    .slice(0,2)
    .map(
      x=>x.charAt(0)
    )
    .join("")
    .toUpperCase();

}


/*
 * -------------------------------------------------------
 * KATEGORİLER
 * -------------------------------------------------------
 */

const CATS = {

  indirim:{
    label:"Nakit İndirim",
    color:"#ffb020"
  },

  kredi:{
    label:"Kredi / Faiz",
    color:"#5b9dff"
  },

  takas:{
    label:"Takas Desteği",
    color:"#00d4b8"
  }

};


let ALL_DATA = [];

let activeBrand =
  "Tümü";

let activeCat =
  "Tümü";

let searchTerm =
  "";


/*
 * -------------------------------------------------------
 * VERİYİ YÜKLE
 * -------------------------------------------------------
 */

async function loadData(){

  const content =
    document.getElementById(
      'content'
    );


  content.innerHTML =
    '<div class="loading">Kampanyalar getiriliyor…</div>';


  try{


    /*
     * MODEL LINKLERİ
     */

    try{

      const linkRes =
        await fetch(
          '/data/model-links.json',
          {
            cache:'no-store'
          }
        );


      if(linkRes.ok){

        const linkJson =
          await linkRes.json();


        MODEL_LINKS =
          linkJson.exact || {};

      }


    }catch(linkError){

      console.warn(
        "Model linkleri yüklenemedi",
        linkError
      );


      MODEL_LINKS = {};

    }


    /*
     * MEVCUT KAMPANYALARI OKU
     *
     * refresh=1 YOK.
     *
     * CLAUDE / ANTHROPIC API
     * ÇALIŞTIRILMAZ.
     */

    const res =
      await fetch(
        '/api/campaigns'
      );


    const json =
      await res.json();


    if(!res.ok){

      throw new Error(
        json.error ||
        "Bilinmeyen hata"
      );

    }


    ALL_DATA =
      json.campaigns || [];


    /*
     * SON GÜNCELLEME
     */

    const lastUpdated =
      document.getElementById(
        'lastUpdated'
      );


    if(json.updatedAt){

      const date =
        new Date(
          json.updatedAt
        );


      const formatted =
        date.toLocaleString(
          'tr-TR',
          {

            timeZone:
              'Europe/Istanbul',

            day:
              '2-digit',

            month:
              'long',

            year:
              'numeric',

            hour:
              '2-digit',

            minute:
              '2-digit'

          }
        );


      lastUpdated.textContent =
        `Son güncelleme: ${formatted} · ${ALL_DATA.length} kampanya`;

    }else{

      lastUpdated.textContent =
        `${ALL_DATA.length} kampanya`;

    }


    renderAll();


  }catch(error){

    content.innerHTML = `

      <div class="error">

        Veri alınamadı:
        ${error.message}

      </div>

    `;

  }

}


/*
 * -------------------------------------------------------
 * MARKALAR
 * -------------------------------------------------------
 */

function uniqueBrands(){

  return [

    "Tümü",

    ...Array
      .from(
        new Set(
          ALL_DATA.map(
            d=>d.brand
          )
        )
      )
      .sort(
        (a,b)=>
          a.localeCompare(
            b,
            'tr'
          )
      )

  ];

}


function renderChips(){

  const container =
    document.getElementById(
      'brandChips'
    );


  container.innerHTML =
    "";


  uniqueBrands()
    .forEach(
      brand=>{

        const el =
          document.createElement(
            'div'
          );


        el.className =
          'chip' +
          (
            brand ===
            activeBrand
              ? ' active'
              : ''
          );


        el.textContent =
          brand;


        el.onclick =
          ()=>{

            activeBrand =
              brand;


            renderAll();

          };


        container.appendChild(
          el
        );

      }
    );

}


/*
 * -------------------------------------------------------
 * KATEGORİLER
 * -------------------------------------------------------
 */

function renderCats(){

  const container =
    document.getElementById(
      'catRow'
    );


  container.innerHTML =
    "";


  const all =
    document.createElement(
      'button'
    );


  all.className =
    'cat-btn' +
    (
      activeCat ===
      'Tümü'
        ? ' active'
        : ''
    );


  all.textContent =
    'Tüm kategoriler';


  all.onclick =
    ()=>{

      activeCat =
        'Tümü';


      renderAll();

    };


  container.appendChild(
    all
  );


  Object.entries(
    CATS
  )
    .forEach(
      ([key,val])=>{

        const btn =
          document.createElement(
            'button'
          );


        btn.className =
          'cat-btn' +
          (
            activeCat === key
              ? ' active'
              : ''
          );


        btn.textContent =
          val.label;


        btn.onclick =
          ()=>{

            activeCat =
              key;


            renderAll();

          };


        container.appendChild(
          btn
        );

      }
    );

}


/*
 * -------------------------------------------------------
 * FİLTRELE
 * -------------------------------------------------------
 */

function filtered(){

  return ALL_DATA

    .filter(
      d=>{


        if(
          activeBrand !==
          "Tümü" &&
          d.brand !==
          activeBrand
        ){

          return false;

        }


        if(
          activeCat !==
          "Tümü" &&
          d.cat !==
          activeCat
        ){

          return false;

        }


        if(searchTerm){

          const hay =
            (
              d.brand +
              " " +
              d.model +
              " " +
              (
                d.headline ||
                ""
              ) +
              " " +
              (
                d.detail ||
                ""
              )
            )
            .toLocaleLowerCase(
              'tr-TR'
            );


          if(
            !hay.includes(
              searchTerm
                .toLocaleLowerCase(
                  'tr-TR'
                )
            )
          ){

            return false;

          }

        }


        return true;

      }
    )

    .sort(
      (a,b)=>
        (b.amount || 0) -
        (a.amount || 0)
    );

}


/*
 * -------------------------------------------------------
 * YENİ / GÜNCELLENDİ
 * -------------------------------------------------------
 */

function daysSince(
  dateString
){

  if(!dateString){

    return Infinity;

  }


  const date =
    new Date(
      dateString
    );


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return Infinity;

  }


  return (
    Date.now() -
    date.getTime()
  ) /
  (
    1000 *
    60 *
    60 *
    24
  );

}


function getCampaignStatus(d){

  const firstSeenDays =
    daysSince(
      d.firstSeenAt
    );


  const changedDays =
    daysSince(
      d.lastChangedAt
    );


  if(
    firstSeenDays < 3
  ){

    return 'new';

  }


  if(
    changedDays < 3
  ){

    return 'updated';

  }


  return null;

}


/*
 * -------------------------------------------------------
 * KARTLAR
 * -------------------------------------------------------
 */

function renderGrid(){

  const items =
    filtered();


  const content =
    document.getElementById(
      'content'
    );


  const countLine =
    document.getElementById(
      'countLine'
    );


  countLine.textContent =
    items.length +
    " kampanya listeleniyor";


  if(
    items.length === 0
  ){

    content.innerHTML =
      '<div class="empty">Aramanızla eşleşen kampanya bulunamadı.</div>';


    return;

  }


  const grid =
    document.createElement(
      'div'
    );


  grid.className =
    'grid';


  items.forEach(
    d=>{


      const cat =
        CATS[d.cat] ||
        CATS.indirim;


      const status =
        getCampaignStatus(d);


      const modelLink =
        getModelLink(d);


      const logo =
        getBrandLogo(
          d.brand
        );


      let statusBadge =
        '';


      if(
        status === 'new'
      ){

        statusBadge =
          '<div class="new-badge">✦ YENİ</div>';

      }else if(
        status === 'updated'
      ){

        statusBadge =
          '<div class="updated-badge">↻ GÜNCELLENDİ</div>';

      }


      /*
       * LOGO HTML
       */

      const logoHtml =
        logo
        ? `

          <div class="logo-area">

            <img
              class="brand-logo"
              src="${logo}"
              alt="${d.brand} logosu"
              loading="lazy"

              onerror="
                this.style.display='none';
                this.nextElementSibling.style.display='flex';
              "
            >

            <div
              class="logo-fallback"
              style="display:none"
            >
              ${initials(d.brand)}
            </div>

          </div>

        `
        : `

          <div class="logo-area">

            <div class="logo-fallback">
              ${initials(d.brand)}
            </div>

          </div>

        `;


      /*
       * BUTON
       */

      const buttonHtml =
        modelLink
        ? `

          <button
            type="button"
            class="campaign-btn"
          >
            Kampanyayı İncele →
          </button>

        `
        : '';


      /*
       * KART
       */

      const card =
        document.createElement(
          'div'
        );


      card.className =
        'card';


      card.style.setProperty(
        '--cat-color',
        cat.color
      );


      if(modelLink){

        card.classList.add(
          'clickable'
        );


        card.style.cursor =
          'pointer';


        card.onclick =
          ()=>{

            window.open(
              modelLink,
              '_blank',
              'noopener,noreferrer'
            );

          };

      }


      card.innerHTML = `

        <div class="card-top">


          <div class="card-brand-row">

            ${logoHtml}


            <div>

              <div class="brand">
                ${d.brand}
              </div>


              <div class="model">
                ${d.model}
              </div>

            </div>

          </div>


          <div class="status-badges">

            ${statusBadge}

            <div class="badge">
              ${cat.label}
            </div>

          </div>


        </div>


        <div class="headline">
          ${d.headline}
        </div>


        <div class="detail">
          ${d.detail || ""}
        </div>


        <div class="card-foot">


          <div class="validity">

            Geçerlilik:
            ${d.until || "—"}

          </div>


          ${buttonHtml}


        </div>

      `;


      /*
       * BUTTON CLICK
       */

      if(modelLink){

        const button =
          card.querySelector(
            '.campaign-btn'
          );


        button.onclick =
          event=>{


            event.stopPropagation();


            window.open(
              modelLink,
              '_blank',
              'noopener,noreferrer'
            );

          };

      }


      grid.appendChild(
        card
      );

    }
  );


  content.innerHTML =
    "";


  content.appendChild(
    grid
  );

}


/*
 * -------------------------------------------------------
 * EKRANI ÇİZ
 * -------------------------------------------------------
 */

function renderAll(){

  renderChips();

  renderCats();

  renderGrid();

}

document

      renderGrid();

    }
  );

loadData();
