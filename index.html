<style>

:root{
  --bg:#12151a;
  --surface:#1b1f26;
  --surface-2:#232833;
  --border:#2a303c;
  --text:#edeff2;
  --text-muted:#8b93a1;
  --amber:#ffb020;
  --teal:#00d4b8;
  --red:#ff5c5c;
  --blue:#5b9dff;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;

  background:
    radial-gradient(
      ellipse at 20% -10%,
      rgba(0,212,184,.08),
      transparent 45%
    ),
    radial-gradient(
      ellipse at 90% 0%,
      rgba(255,176,32,.06),
      transparent 40%
    ),
    var(--bg);

  color:var(--text);

  font-family:
    'IBM Plex Sans',
    sans-serif;

  -webkit-font-smoothing:antialiased;
}

.wrap{
  max-width:1100px;
  margin:0 auto;
  padding:36px 20px 80px;
}

/* HERO */

.hero{
  border:1px solid var(--border);
  border-radius:14px;

  background:
    linear-gradient(
      180deg,
      var(--surface),
      var(--surface-2)
    );

  padding:32px 28px;
  margin-bottom:22px;
}

h1{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:clamp(28px,5vw,44px);
  text-transform:uppercase;
  margin:0 0 8px;
  line-height:1.05;
}

.hero p.sub{
  color:var(--text-muted);
  margin:0 0 20px;
  font-size:14.5px;
}

.status-row{
  display:flex;
  gap:12px;
  flex-wrap:wrap;

  font-family:
    'IBM Plex Mono',
    monospace;

  font-size:12px;
  color:var(--text-muted);
}

/* ANA MENÜ */

.main-tabs{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:22px;

  border-bottom:
    1px solid var(--border);

  padding-bottom:10px;
}

.main-tab{
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text-muted);

  padding:10px 17px;
  border-radius:9px;

  font-family:
    'IBM Plex Mono',
    monospace;

  font-size:12px;
  cursor:pointer;
  text-decoration:none;

  transition:
    border-color .15s,
    color .15s,
    background .15s;
}

.main-tab:hover{
  color:var(--text);
  border-color:#4c5668;
}

.main-tab.active{
  color:#0a1512;
  background:var(--teal);
  border-color:var(--teal);
  font-weight:700;
}

/* SEARCH */

.filters{
  display:flex;
  gap:10px;
  margin-bottom:16px;
}

.search{
  flex:1;

  background:var(--surface);

  border:
    1px solid var(--border);

  border-radius:9px;

  padding:12px 14px;

  color:var(--text);

  font-size:14px;
}

.search:focus{
  outline:none;
  border-color:var(--teal);
}

.search::placeholder{
  color:var(--text-muted);
}

/* MARKALAR */

.chip-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:14px;
}

.chip{
  font-family:
    'IBM Plex Mono',
    monospace;

  font-size:12px;

  padding:
    7px 13px;

  border-radius:999px;

  border:
    1px solid var(--border);

  background:
    var(--surface);

  color:
    var(--text-muted);

  cursor:pointer;
}

.chip:hover{
  border-color:var(--teal);
  color:var(--text);
}

.chip.active{
  background:var(--teal);
  color:#0a1512;
  border-color:var(--teal);
  font-weight:600;
}

/* KATEGORİ */

.cat-row{
  display:flex;
  gap:8px;
  margin-bottom:22px;
  flex-wrap:wrap;
}

.cat-btn{
  font-size:12.5px;

  padding:
    7px 14px;

  border-radius:8px;

  border:
    1px solid var(--border);

  background:transparent;
  color:var(--text-muted);
  cursor:pointer;
}

.cat-btn:hover{
  color:var(--text);
  border-color:#4c5668;
}

.cat-btn.active{
  background:var(--surface-2);
  color:var(--text);
  border-color:var(--amber);
}

.count-line{
  font-size:12.5px;
  color:var(--text-muted);
  margin-bottom:14px;
  font-family:'IBM Plex Mono',monospace;
}

/* GRID */

.grid{
  display:grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(290px,1fr)
    );

  gap:15px;
}

/* CARD */

.card{
  border:1px solid var(--border);

  background:
    linear-gradient(
      145deg,
      var(--surface),
      #191d24
    );

  border-radius:13px;
  padding:18px;

  position:relative;

  display:flex;
  flex-direction:column;

  min-height:265px;

  transition:
    transform .15s,
    border-color .15s,
    box-shadow .15s;
}

.card:hover{
  transform:translateY(-3px);

  border-color:
    var(
      --cat-color,
      var(--teal)
    );
}

.card.clickable:hover{
  box-shadow:
    0 12px 35px rgba(0,0,0,.25);
}

.card::before{
  content:"";

  position:absolute;
  top:0;
  left:18px;
  right:18px;

  height:3px;

  background:
    var(
      --cat-color,
      var(--teal)
    );
}

/* MARKA */

.card-brand-row{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-logo{
  width:34px;
  height:34px;
  object-fit:contain;
  background:transparent;
  padding:2px;
}

.logo-fallback{
  width:34px;
  height:34px;

  border-radius:8px;
  background:var(--surface-2);

  display:flex;
  align-items:center;
  justify-content:center;

  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  font-weight:700;
}

.brand{
  font-family:'Oswald',sans-serif;
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--text-muted);
}

.model{
  font-family:'Oswald',sans-serif;
  font-size:21px;
  font-weight:600;
  margin-top:2px;
}

.card-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:15px;
  gap:12px;
}

/* BADGES */

.status-badges{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.badge{
  font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;
  padding:4px 8px;
  border-radius:6px;

  background:
    var(
      --cat-color,
      var(--teal)
    );

  color:#0a1512;
  font-weight:700;
  text-transform:uppercase;
}

.new-badge,
.updated-badge{
  font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;
  padding:4px 8px;
  border-radius:999px;
  font-weight:700;
}

.new-badge{
  background:#ff5c5c;
  color:#fff;
}

.updated-badge{
  background:#ffb020;
  color:#16120a;
}

/* CONTENT */

.headline{
  font-size:18px;
  font-weight:700;
  margin:4px 0 8px;
  line-height:1.25;
}

.detail{
  font-size:13px;
  color:var(--text-muted);
  line-height:1.5;
  margin-bottom:16px;
  flex:1;
}

.card-foot{
  border-top:
    1px dashed var(--border);

  padding-top:12px;
  margin-top:auto;
}

.validity{
  font-size:11px;
  color:var(--text-muted);
  font-family:'IBM Plex Mono',monospace;
  margin-bottom:10px;
}

.campaign-btn{
  width:100%;

  border:
    1px solid
    var(
      --cat-color,
      var(--teal)
    );

  background:
    rgba(255,255,255,.025);

  color:var(--text);

  padding:9px 12px;
  border-radius:8px;

  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  font-weight:600;
  cursor:pointer;
}

.campaign-btn:hover{
  background:
    var(
      --cat-color,
      var(--teal)
    );

  color:#0a1512;
}

.empty,
.loading,
.error{
  text-align:center;
  padding:60px 20px;

  color:var(--text-muted);

  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
}

.error{
  color:var(--red);
}

footer{
  margin-top:40px;
  padding-top:20px;

  border-top:
    1px solid var(--border);

  font-size:12px;
  color:var(--text-muted);
}

/* MOBILE */

@media(max-width:700px){

  .wrap{
    padding:20px 14px 60px;
  }

  .hero{
    padding:25px 20px;
  }

  .main-tabs{
    overflow-x:auto;
    scrollbar-width:none;
  }

  .main-tabs::-webkit-scrollbar{
    display:none;
  }

  .main-tab{
    flex:0 0 auto;
  }

  .chip-row{
    flex-wrap:nowrap;
    overflow-x:auto;
    scrollbar-width:none;
  }

  .chip-row::-webkit-scrollbar{
    display:none;
  }

  .cat-row{
    flex-wrap:nowrap;
    overflow-x:auto;
    scrollbar-width:none;
  }

  .cat-row::-webkit-scrollbar{
    display:none;
  }

  .cat-btn{
    flex:0 0 auto;
  }

  .grid{
    grid-template-columns:1fr;
  }

}

</style>

    </p>

    <div
      class="status-row"
      id="lastUpdated"
    >
      Son güncelleme bilgisi yükleniyor...

<script>

let MODEL_LINKS = {};

function normalizeLinkKey(value){

  return String(value || "")
    .toLocaleLowerCase("tr-TR")
    .replace(/\s+/g," ")
    .trim();

}

function getModelLink(d){

  const key =
    `${normalizeLinkKey(d.brand)}|` +
    `${normalizeLinkKey(d.model)}`;

  return MODEL_LINKS[key] || null;

}


/* MARKA LOGOLARI */

const BRAND_DOMAINS = {

  "Volkswagen":"volkswagen.com.tr",
  "Skoda":"skoda.com.tr",
  "Škoda":"skoda.com.tr",
  "Cupra":"cupraofficial.com.tr",
  "Renault":"renault.com.tr",
  "Dacia":"dacia.com.tr",
  "Peugeot":"peugeot.com.tr",
  "Citroen":"citroen.com.tr",
  "Citroën":"citroen.com.tr",
  "Opel":"opel.com.tr",
  "Ford":"ford.com.tr",
  "Fiat":"fiat.com.tr",
  "Toyota":"toyota.com.tr",
  "Honda":"honda.com.tr",
  "Hyundai":"hyundai.com",
  "Kia":"kia.com",
  "Nissan":"nissan.com.tr",
  "Chery":"chery.com.tr",
  "BYD":"bydauto.com.tr",
  "MG":"mg-turkey.com",
  "Jaecoo":"omodajaecoo.com.tr",
  "Omoda":"omodajaecoo.com.tr",
  "Suzuki":"suzuki.com.tr",
  "BMW":"bmw.com.tr",
  "Mercedes-Benz":"mercedes-benz.com.tr",
  "Audi":"audi.com.tr",
  "Volvo":"volvocars.com",
  "Lexus":"lexus.com.tr",
  "Porsche":"porsche.com.tr",
  "Land Rover":"landrover.com.tr",
  "Jaguar":"jaguar.com.tr",
  "Alfa Romeo":"alfaromeo.com.tr",
  "Togg":"togg.com.tr",
  "DS Automobiles":"dsautomobiles.com.tr"

};

function getBrandLogo(brand){

  const domain =
    BRAND_DOMAINS[brand];

  if(!domain){
    return null;
  }

  return (
    "https://www.google.com/s2/favicons" +
    "?domain=" +
    encodeURIComponent(domain) +
    "&sz=128"
  );

}

function initials(brand){

  return String(brand || "")
    .split(/\s+/)
    .filter(Boolean)
    .slice(0,2)
    .map(x=>x.charAt(0))
    .join("")
    .toUpperCase();

}


/* KATEGORİLER */

const CATS = {

  indirim:{
    label:"Nakit İndirim",
    color:"#ffb020"
  },

  kredi:{
    label:"Kredi / Faiz",
    color:"#5b9dff"
  },

  takas:{
    label:"Takas Desteği",
    color:"#00d4b8"
  }

};


let ALL_DATA = [];
let activeBrand = "Tümü";
let activeCat = "Tümü";
let searchTerm = "";


/* VERİ */

async function loadData(){

  const content =
    document.getElementById("content");

  content.innerHTML =
    '<div class="loading">Kampanyalar getiriliyor…</div>';


  try{

    try{

      const linkRes =
        await fetch(
          "/data/model-links.json",
          {
            cache:"no-store"
          }
        );

      if(linkRes.ok){

        const linkJson =
          await linkRes.json();

        MODEL_LINKS =
          linkJson.exact || {};

      }

    }catch(error){

      console.warn(
        "Model linkleri yüklenemedi",
        error
      );

      MODEL_LINKS = {};

    }


    const res =
      await fetch(
        "/api/campaigns"
      );

    const json =
      await res.json();


    if(!res.ok){

      throw new Error(
        json.error ||
        "Bilinmeyen hata"
      );

    }


    ALL_DATA =
      json.campaigns || [];


    const lastUpdated =
      document.getElementById(
        "lastUpdated"
      );


    if(json.updatedAt){

      const date =
        new Date(
          json.updatedAt
        );

      const formatted =
        date.toLocaleString(
          "tr-TR",
          {
            timeZone:"Europe/Istanbul",
            day:"2-digit",
            month:"long",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
          }
        );

      lastUpdated.textContent =
        `Son güncelleme: ${formatted} · ${ALL_DATA.length} kampanya`;

    }else{

      lastUpdated.textContent =
        `${ALL_DATA.length} kampanya`;

    }


    renderAll();


  }catch(err){

    content.innerHTML =
      `
        <div class="error">
          Veri alınamadı: ${err.message}
        </div>
      `;

  }

}


/* MARKALAR */

function uniqueBrands(){

  return [

    "Tümü",

    ...Array.from(
      new Set(
        ALL_DATA.map(
          d=>d.brand
        )
      )
    ).sort(
      (a,b)=>
        a.localeCompare(
          b,
          "tr"
        )
    )

  ];

}


function renderChips(){

  const container =
    document.getElementById(
      "brandChips"
    );

  container.innerHTML = "";


  uniqueBrands()
    .forEach(
      brand=>{

        const el =
          document.createElement(
            "div"
          );

        el.className =
          "chip" +
          (
            brand === activeBrand
              ? " active"
              : ""
          );

        el.textContent =
          brand;

        el.onclick =
          ()=>{

            activeBrand =
              brand;

            renderAll();

          };

        container.appendChild(
          el
        );

      }
    );

}


/* KATEGORİ */

function renderCats(){

  const container =
    document.getElementById(
      "catRow"
    );

  container.innerHTML = "";


  const all =
    document.createElement(
      "button"
    );

  all.className =
    "cat-btn" +
    (
      activeCat ===
      "Tümü"
        ? " active"
        : ""
    );

  all.textContent =
    "Tüm kategoriler";

  all.onclick =
    ()=>{

      activeCat =
        "Tümü";

      renderAll();

    };

  container.appendChild(
    all
  );


  Object.entries(
    CATS
  ).forEach(
    ([key,val])=>{

      const btn =
        document.createElement(
          "button"
        );

      btn.className =
        "cat-btn" +
        (
          activeCat === key
            ? " active"
            : ""
        );

      btn.textContent =
        val.label;

      btn.onclick =
        ()=>{

          activeCat =
            key;

          renderAll();

        };

      container.appendChild(
        btn
      );

    }
  );

}


/* FILTER */

function filtered(){

  return ALL_DATA

    .filter(
      d=>{

        if(
          activeBrand !== "Tümü" &&
          d.brand !== activeBrand
        ){
          return false;
        }


        if(
          activeCat !== "Tümü" &&
          d.cat !== activeCat
        ){
          return false;
        }


        if(searchTerm){

          const hay =
            (
              d.brand +
              " " +
              d.model +
              " " +
              (d.headline || "") +
              " " +
              (d.detail || "")
            )
            .toLocaleLowerCase(
              "tr-TR"
            );


          if(
            !hay.includes(
              searchTerm
                .toLocaleLowerCase(
                  "tr-TR"
                )
            )
          ){
            return false;
          }

        }

        return true;

      }
    )

    .sort(
      (a,b)=>
        (b.amount || 0) -
        (a.amount || 0)
    );

}


/* STATUS */

function daysSince(dateString){

  if(!dateString){
    return Infinity;
  }

  const date =
    new Date(
      dateString
    );

  if(
    Number.isNaN(
      date.getTime()
    )
  ){
    return Infinity;
  }

  return (
    Date.now() -
    date.getTime()
  ) /
  (
    1000 *
    60 *
    60 *
    24
  );

}


function getCampaignStatus(d){

  if(
    daysSince(
      d.firstSeenAt
    ) < 3
  ){
    return "new";
  }

  if(
    daysSince(
      d.lastChangedAt
    ) < 3
  ){
    return "updated";
  }

  return null;

}


/* GRID */

function renderGrid(){

  const items =
    filtered();

  const content =
    document.getElementById(
      "content"
    );

  document
    .getElementById(
      "countLine"
    )
    .textContent =
      items.length +
      " kampanya listeleniyor";


  if(
    items.length === 0
  ){

    content.innerHTML =
      '<div class="empty">Aramanızla eşleşen kampanya bulunamadı.</div>';

    return;

  }


  const grid =
    document.createElement(
      "div"
    );

  grid.className =
    "grid";


  items.forEach(
    d=>{

      const cat =
        CATS[d.cat] ||
        CATS.indirim;

      const status =
        getCampaignStatus(d);

      const modelLink =
        getModelLink(d);

      const logo =
        getBrandLogo(
          d.brand
        );


      let statusBadge = "";

      if(status === "new"){

        statusBadge =
          '<div class="new-badge">✦ YENİ</div>';

      }else if(
        status === "updated"
      ){

        statusBadge =
          '<div class="updated-badge">↻ GÜNCELLENDİ</div>';

      }


      const card =
        document.createElement(
          "div"
        );

      card.className =
        "card";

      card.style.setProperty(
        "--cat-color",
        cat.color
      );


      if(modelLink){

        card.classList.add(
          "clickable"
        );

        card.style.cursor =
          "pointer";

        card.onclick =
          ()=>{

            window.open(
              modelLink,
              "_blank",
              "noopener,noreferrer"
            );

          };

      }


      const logoHtml =
        logo
          ? `
            <img
              class="brand-logo"
              src="${logo}"
              alt="${d.brand}"
              loading="lazy"
              onerror="
                this.style.display='none';
                this.nextElementSibling.style.display='flex';
              "
            >

            <div
              class="logo-fallback"
              style="display:none"
            >
              ${initials(d.brand)}
            </div>
          `
          : `
            <div class="logo-fallback">
              ${initials(d.brand)}
            </div>
          `;


      const buttonHtml =
        modelLink
          ? `
            <button
              type="button"
              class="campaign-btn"
            >
              Kampanyayı İncele →
            </button>
          `
          : "";


      card.innerHTML = `

        <div class="card-top">

          <div class="card-brand-row">

            ${logoHtml}

            <div>

              <div class="brand">
                ${d.brand}
              </div>

              <div class="model">
                ${d.model}
              </div>

            </div>

          </div>


          <div class="status-badges">

            ${statusBadge}

            <div class="badge">
              ${cat.label}
            </div>

          </div>

        </div>


        <div class="headline">
          ${d.headline}
        </div>


        <div class="detail">
          ${d.detail || ""}
        </div>


        <div class="card-foot">

          <div class="validity">
            Geçerlilik:
            ${d.until || "—"}
          </div>

          ${buttonHtml}

        </div>

      `;


      if(modelLink){

        const button =
          card.querySelector(
            ".campaign-btn"
          );

        button.onclick =
          event=>{

            event.stopPropagation();

            window.open(
              modelLink,
              "_blank",
              "noopener,noreferrer"
            );

          };

      }


      grid.appendChild(
        card
      );

    }
  );


  content.innerHTML = "";

  content.appendChild(
    grid
  );

}


function renderAll(){

  renderChips();
  renderCats();
  renderGrid();

}


document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    event=>{

      searchTerm =
        event.target.value;

      renderGrid();

    }
  );


loadData();

</script>

</body>
</html>
